name: Validate MONO
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Chromium regressions (development and production)
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-reports
          path: test-results/
          retention-days: 7
